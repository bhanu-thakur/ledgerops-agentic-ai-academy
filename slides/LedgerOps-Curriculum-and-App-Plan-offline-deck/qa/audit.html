<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<title>Offline deck audit</title>
<link rel="stylesheet" href="../theme/fonts.css">
<link rel="stylesheet" href="../theme/tokens.css">
<link rel="stylesheet" href="../theme/deck.css">
<link rel="stylesheet" href="../theme/grid.css">
<link rel="stylesheet" href="../theme/layouts.css">
<link rel="stylesheet" href="../theme/improved.css">
<style>
  html, body { margin: 0; background: #fff; }
  .slides section { display: block; }
  .slide { overflow: visible !important; }
  #report { font: 13px/1.5 Consolas, monospace; white-space: pre; padding: 16px; }
</style>
</head>
<body class="variant-improved">
<div class="reveal" style="position:absolute;left:-99999px;top:0"><div class="slides"></div></div>
<pre id="report">running…</pre>

<script src="../engine/format.js"></script>
<script src="../engine/icons.js"></script>
<script src="../engine/charts.js"></script>
<script src="../content.js"></script>
<script src="../content-transform.js"></script>
<script src="../engine/render.js"></script>
<script>
mountIcons();
build();

const CANVAS_W = 1600;
const CANVAS_H = 900;
const MIN_FONT = 15;
const out = [];
let fails = 0;
let warns = 0;

document.querySelectorAll(".slides section").forEach((sec, index) => {
  const slide = sec.querySelector(".slide");
  const number = index + 1;
  const spec = DECK.slides[index];
  const slideBox = slide.getBoundingClientRect();
  const issues = [];
  const footEl = slide.querySelector(".foot");
  const limitY = footEl
    ? footEl.getBoundingClientRect().top - slideBox.top - 10
    : CANVAS_H - 40;
  const padX = parseFloat(getComputedStyle(slide).paddingLeft);

  slide.querySelectorAll("*").forEach(el => {
    if (el.closest(".foot") || !el.getClientRects().length) return;
    const box = el.getBoundingClientRect();
    const top = box.top - slideBox.top;
    const bottom = box.bottom - slideBox.top;
    const right = box.right - slideBox.left;

    if (bottom > limitY + 1 && el.children.length === 0) {
      issues.push(`OVERFLOW-Y  ${describe(el)} bottom ${Math.round(bottom)} > ${Math.round(limitY)}`);
    }
    if (right > CANVAS_W - padX + 2 && el.children.length === 0) {
      issues.push(`OVERFLOW-X  ${describe(el)} right ${Math.round(right)} > ${Math.round(CANVAS_W - padX)}`);
    }
    if (top < -1) issues.push(`ABOVE-TOP   ${describe(el)} top ${Math.round(top)}`);
    if (el.children.length === 0 && el.textContent.trim()) {
      const fontSize = parseFloat(getComputedStyle(el).fontSize);
      if (fontSize < MIN_FONT) issues.push(`TINY-TEXT   ${describe(el)} ${fontSize}px < ${MIN_FONT}px`);
    }
  });

  const headEl = slide.querySelector(".head");
  const bodyEl = slide.querySelector(".body");
  if (headEl && bodyEl && footEl) {
    const children = [...bodyEl.children].filter(child => child.getClientRects().length);
    if (children.length) {
      const above = Math.min(...children.map(child => child.getBoundingClientRect().top - slideBox.top))
        - (headEl.getBoundingClientRect().bottom - slideBox.top);
      const below = (footEl.getBoundingClientRect().top - slideBox.top)
        - Math.max(...children.map(child => child.getBoundingClientRect().bottom - slideBox.top));
      if (Math.abs(above - below) > 4) {
        issues.push(`ASYMMETRY   ${Math.round(above)}px above vs ${Math.round(below)}px below`);
      }
    }
    const topMargin = headEl.getBoundingClientRect().top - slideBox.top;
    const bottomMargin = CANVAS_H - (footEl.getBoundingClientRect().bottom - slideBox.top);
    if (Math.abs(topMargin - bottomMargin) > 2) {
      issues.push(`ASYMMETRY   top ${Math.round(topMargin)}px vs bottom ${Math.round(bottomMargin)}px`);
    }
  }

  const body = slide.querySelector(".body, .l-cover, .l-section, .l-closing");
  let fillNote = "";
  if (body) {
    const children = [...body.children].filter(child => child.getClientRects().length);
    if (children.length) {
      const low = Math.min(...children.map(child => child.getBoundingClientRect().top - slideBox.top));
      const high = Math.max(...children.map(child => child.getBoundingClientRect().bottom - slideBox.top));
      const available = limitY - (body.getBoundingClientRect().top - slideBox.top);
      const fill = available > 0 ? (high - low) / available : 1;
      fillNote = ` fill ${(fill * 100).toFixed(0)}%`;
      if (fill < 0.6) issues.push(`DEAD-SPACE  body fills only ${(fill * 100).toFixed(0)}%`);
    }
  }

  const hard = issues.filter(issue => !issue.startsWith("DEAD-SPACE"));
  const soft = issues.filter(issue => issue.startsWith("DEAD-SPACE"));
  fails += hard.length;
  warns += soft.length;
  const tag = hard.length ? "FAIL" : soft.length ? "WARN" : "ok  ";
  out.push(`${tag} ${String(number).padStart(2)}  ${spec.layout.padEnd(10)}${fillNote}`);
  issues.forEach(issue => out.push(`         - ${issue}`));
});

const css = getComputedStyle(document.body);
const paletteChecks = [
  ["text-3 / paper", css.getPropertyValue("--text-3"), css.getPropertyValue("--paper"), 4.5],
  ["accent / paper", css.getPropertyValue("--accent"), css.getPropertyValue("--paper"), 4.5],
  ["dtext-3 / ink", css.getPropertyValue("--dtext-3"), css.getPropertyValue("--ink"), 4.5],
  ["accent-dark / ink", css.getPropertyValue("--accent-dark"), css.getPropertyValue("--ink"), 4.5]
];
out.push("\nCONTRAST TOKENS");
paletteChecks.forEach(([label, foreground, background, minimum]) => {
  const ratio = contrast(foreground.trim(), background.trim());
  if (ratio < minimum) fails += 1;
  out.push(`${ratio >= minimum ? "ok  " : "FAIL"} ${label.padEnd(20)} ${ratio.toFixed(2)}:1`);
});

out.unshift(`SLIDES ${DECK.slides.length}   HARD ${fails}   SOFT ${warns}\n`);
document.getElementById("report").textContent = out.join("\n");

function describe(el) {
  const text = (el.textContent || "").trim().replace(/\s+/g, " ").slice(0, 34);
  const className = (el.getAttribute("class") || "").split(" ")[0] || "-";
  return `${el.tagName.toLowerCase()}.${className} "${text}"`;
}

function contrast(foreground, background) {
  const first = luminance(foreground);
  const second = luminance(background);
  return (Math.max(first, second) + 0.05) / (Math.min(first, second) + 0.05);
}

function luminance(hex) {
  const value = hex.replace("#", "");
  const channels = [0, 2, 4].map(index => parseInt(value.slice(index, index + 2), 16) / 255)
    .map(channel => channel <= 0.04045 ? channel / 12.92 : Math.pow((channel + 0.055) / 1.055, 2.4));
  return 0.2126 * channels[0] + 0.7152 * channels[1] + 0.0722 * channels[2];
}
</script>
</body>
</html>
