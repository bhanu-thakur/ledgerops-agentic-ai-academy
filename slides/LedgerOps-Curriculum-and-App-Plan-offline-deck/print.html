<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SlideX Presentation</title>
<link rel="stylesheet" href="vendor/reveal/dist/reset.css">
<link rel="stylesheet" href="theme/fonts.css">
<link rel="stylesheet" href="theme/tokens.css">
<link rel="stylesheet" href="theme/deck.css">
<link rel="stylesheet" href="theme/grid.css">
<link rel="stylesheet" href="theme/layouts.css">
<link rel="stylesheet" href="theme/improved.css">
<link rel="stylesheet" href="theme/print.css">
<style>
  /* ---- A4 landscape page geometry -------------------------
     A4 landscape = 297mm x 210mm. The deck canvas is 1600x900
     (16:9), wider than A4, so each slide is fitted to the page
     width and centred vertically. Nothing is cropped.

     The page tree deliberately keeps reveal's ancestor chain
     (.reveal > .slides > section) even though reveal.js and
     reveal.css are not loaded here: deck.css hangs the deck's
     whole base typography off `.reveal`, so dropping that
     ancestor silently reverts every heading to the browser's
     default serif. The chain is the contract, not decoration. */
  @page { size: A4 landscape; margin: 0; }

  html, body {
    margin: 0; padding: 0;
    background: #fff;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  #stage { display: none; }

  .page {
    width: 297mm;
    height: 210mm;
    overflow: hidden;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff;
    page-break-after: always;
    break-after: page;
  }
  .page:last-child { page-break-after: auto; break-after: auto; }

  /* A 16:9 canvas on a 1.41:1 sheet leaves a band above and below. On a
     light slide it is invisible against the paper; on a dark one it framed
     the slide in white, which read as a printing fault. The sheet takes the
     slide's own ground instead. */
  .page--dark { background: var(--ink); }

  /* 297mm = 1122.52px at 96dpi; 1122.52 / 1600 = 0.701575 */
  .page__fit {
    width: var(--canvas-w);
    height: var(--canvas-h);
    flex: 0 0 auto;
    transform: scale(0.701575);
    transform-origin: center center;
  }

  .page .slide {
    box-shadow: none !important;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  /* Design-time overlays never belong in a printed handout. */
  .page .grid-overlay, .page .go-line, .tip { display: none !important; }

  @media screen {
    body { background: #d8d8d8; padding: 12px 0; }
    .page { margin: 0 auto 12px; box-shadow: 0 2px 10px rgba(0,0,0,.25); }
  }
</style>
</head>
<body class="variant-improved reveal-viewport">

<div id="stage"><div class="slides"></div></div>
<div id="pages" class="reveal"></div>

<script src="engine/format.js"></script>
<script src="engine/icons.js"></script>
<script src="engine/charts.js"></script>
<script src="content.js"></script>
<script src="content-transform.js"></script>
<script src="engine/render.js"></script>
<script>
  mountIcons();
  build();

  /* Lift each built slide onto its own A4 sheet, rebuilding the
     .reveal > .slides > section chain around it. */
  const pages = document.getElementById("pages");
  document.querySelectorAll("#stage .slides > section").forEach(sec => {
    const page = document.createElement("div");
    page.className = "page";

    const fit = document.createElement("div");
    fit.className = "slides page__fit";
    fit.appendChild(sec);

    if (sec.querySelector(".slide--dark")) page.classList.add("page--dark");
    page.appendChild(fit);
    pages.appendChild(page);
  });
  document.getElementById("stage").remove();

  /* fonts.css embeds Noto Sans as base64 with font-display:block.
     Headless print must not snapshot before those faces decode,
     or the PDF bakes in the fallback face. */
  document.fonts.ready.then(() => { window.__deckReady = true; });
</script>
</body>
</html>
