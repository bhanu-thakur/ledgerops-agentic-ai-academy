<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LedgerOps Academy curriculum</title>
<link rel="stylesheet" href="vendor/reveal/dist/reset.css">
<link rel="stylesheet" href="vendor/reveal/dist/reveal.css">

<body class="variant-improved">
<div class="reveal"><div class="slides"></div></div>
<script src="vendor/reveal/dist/reveal.js"></script>

<script>
  mountIcons();
  build();
  initTooltip();
  initGrid();

    width: 1600,
    height: 900,
    margin: 0,
    minScale: 0.2,
    maxScale: 1.4,
    controls: true,
    progress: true,
    hash: true,
    transition: "fade",
    transitionSpeed: "fast",
    backgroundTransition: "none",
    overview: true,
    center: false,
    plugins: []
  });
